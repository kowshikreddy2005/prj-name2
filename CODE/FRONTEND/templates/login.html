<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <meta name="description" content="Login to RUL Prediction Project" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;400;600;800&display=swap" rel="stylesheet">

  <!-- Bootstrap & Template CSS -->
  <link href="{{ url_for('static', filename='vendor/bootstrap/css/bootstrap.min.css') }}" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='assets/css/fontawesome.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='assets/css/templatemo-space-dynamic.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='assets/css/animated.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='assets/css/owl.css') }}">

  <title>Login - RUL Prediction</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: url('https://media.istockphoto.com/id/2188629767/photo/top-view-concierge-meet-guests-welcome-hotel-reception-muslim-couple-tourists-travelers.jpg?s=612x612&w=0&k=20&c=KpyxEmbcTvw-uwMQNXAPvXrifNomMY2-D-OSzsGqDRk=') no-repeat center center fixed;
      background-size: cover;
    }

    .nav .login-btn a { 
      background: #ff6b6b; 
      color: #fff !important; 
      padding: 8px 18px; 
      border-radius: 25px; 
      transition: 0.3s ease; 
    }
    .nav .login-btn a:hover { background: #ff4757; }

    footer { 
      background-color: rgba(10, 10, 35, 0.9); 
      color: #ccc; 
      font-size: 14px; 
      padding: 20px 0; 
      border-top: 2px solid #ff6b6b; 
      text-align: center; 
    }

    .form-section { 
      min-height: 90vh; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      padding: 40px 0;
    }

    .form-container { 
      max-width: 450px; 
      width: 100%; 
      background: rgba(255,255,255,0.7); 
      backdrop-filter: blur(8px); 
      padding: 40px; 
      border-radius: 15px; 
      box-shadow: 0 8px 25px rgba(0,0,0,0.25); 
    }

    .form-container h2 { 
      text-align: center; 
      margin-bottom: 25px; 
      font-weight: 700; 
    }

    .form-container input { 
      margin-bottom: 15px; 
    }

    .form-container .btn { 
      width: 100%; 
      padding: 10px; 
      font-weight: 600; 
    }

    .message { 
      color: red; 
      text-align: center; 
      margin-bottom: 15px; 
      font-weight: 500; 
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header-area header-sticky">
    <div class="container">
      <div class="row">
        <div class="col-12">
          <nav class="main-nav">
            <a href="{{ url_for('index') }}" class="logo"><h4>RUL <span>Prediction</span></h4></a>
            <ul class="nav">
              <li><a href="{{ url_for('index') }}">Home</a></li>
              <li><a href="{{ url_for('about') }}">About</a></li>
              <li><a href="{{ url_for('register') }}">Register</a></li>
              <li class="login-btn"><a href="{{ url_for('login') }}" class="active">Login</a></li>
            </ul>
            <a class="menu-trigger"><span>Menu</span></a>
          </nav>
        </div>
      </div>
    </div>
  </header>
  <br><br>

  <!-- Login Form -->
  <section class="form-section">
    <div class="form-container">
      <h2>Login</h2>

      {% if message %}
        <div class="message">{{ message }}</div>
      {% endif %}

      <form method="POST" action="{{ url_for('login') }}">
        <input type="email" class="form-control" name="email" placeholder="Email" required>
        <input type="password" class="form-control" name="password" placeholder="Password" required>
        <button type="submit" class="btn btn-primary">Login</button>
      </form>
    </div>
  </section>

  <!-- Footer -->
  <footer>&copy; 2025 RUL Prediction Project. All Rights Reserved.</footer>

  <!-- Scripts -->
  <script src="{{ url_for('static', filename='vendor/jquery/jquery.min.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/bootstrap/js/bootstrap.bundle.min.js') }}"></script>
  <script src="{{ url_for('static', filename='assets/js/owl-carousel.js') }}"></script>
  <script src="{{ url_for('static', filename='assets/js/animation.js') }}"></script>
  <script src="{{ url_for('static', filename='assets/js/imagesloaded.js') }}"></script>
  <script src="{{ url_for('static', filename='assets/js/custom.js') }}"></script>
</body>
</html>
